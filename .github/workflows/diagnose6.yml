name: Isolate 403 cause

on:
  workflow_dispatch:

jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null

      - name: Baseline statuses
        run: |
          for u in /index.html /robots.txt /about.html /404.html /__none.txt; do
            echo -n "$u -> "
            curl -s -o /dev/null -w "%{http_code}\n" --max-time 15 "https://teonoxstudio.com$u"
          done

      - name: Filesystem inspection
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          PORT: ${{ secrets.PORT || 22 }}
        run: |
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts
          SSH_CMD="ssh -p $PORT -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=no"
          TARGET="$USERNAME@$HOST"
          $SSH_CMD "$TARGET" 'D=~/domains/teonoxstudio.com/public_html
            echo "--- stat index.html ---"
            stat -c "%A %U %G %a %n" "$D/index.html"
            echo "--- lsattr (chattr flags) ---"
            lsattr "$D/index.html" 2>/dev/null || echo "lsattr unavailable"
            echo "--- getfacl ---"
            getfacl -p "$D/index.html" 2>/dev/null || echo "getfacl unavailable"
            echo "--- selinux context ---"
            ls -laZ "$D/index.html" 2>/dev/null || echo "no -Z support"
            echo "--- htaccess present? ---"
            ls -la "$D/.htaccess"
            echo "--- mount/attr sanity: control domain same checks ---"
            stat -c "%A %U %G %a %n" ~/domains/blanchedalmond-flamingo-767844.hostingersite.com/public_html/index.html'

      - name: Disable .htaccess and retest
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          PORT: ${{ secrets.PORT || 22 }}
        run: |
          SSH_CMD="ssh -p $PORT -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=no"
          $SSH_CMD "$USERNAME@$HOST" 'mv ~/domains/teonoxstudio.com/public_html/.htaccess ~/domains/teonoxstudio.com/public_html/.htaccess.disabled && echo "htaccess disabled"'
          sleep 3
          for u in /index.html /robots.txt /__none.txt; do
            echo -n "no-htaccess $u -> "
            curl -s -o /dev/null -w "%{http_code}\n" --max-time 15 "https://teonoxstudio.com$u"
          done
          echo -n "control domain index (unchanged) -> "
          curl -s -o /dev/null -w "%{http_code}\n" --max-time 15 https://blanchedalmond-flamingo-767844.hostingersite.com/

      - name: Restore .htaccess
        if: always()
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          PORT: ${{ secrets.PORT || 22 }}
        run: |
          SSH_CMD="ssh -p $PORT -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=no"
          $SSH_CMD "$USERNAME@$HOST" 'D=~/domains/teonoxstudio.com/public_html; [ -f "$D/.htaccess.disabled" ] && mv "$D/.htaccess.disabled" "$D/.htaccess" && echo "htaccess restored" || echo "nothing to restore"'

      - name: Show 403 response headers (origin vs edge)
        run: |
          echo "--- edge ---"
          curl -sI --max-time 15 https://teonoxstudio.com/index.html | head -12
