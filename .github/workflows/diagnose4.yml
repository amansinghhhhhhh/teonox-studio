name: Diagnose origin vhost matrix

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null

      - name: Origin vhost matrix (site vs working control)
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          PORT: ${{ secrets.PORT || 22 }}
        run: |
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts
          SSH_CMD="ssh -p $PORT -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=no"
          TARGET="$USERNAME@$HOST"

          echo "=== HTTPS via SNI on 443 (per-domain vhost match) ==="
          $SSH_CMD "$TARGET" 'for d in teonoxstudio.com blanchedalmond-flamingo-767844.hostingersite.com; do printf "%s -> " "$d"; curl -skS --max-time 10 --resolve "$d:443:127.0.0.1" -o /dev/null -w "%{http_code}" "https://$d/" 2>&1 | tr "\n" " "; echo; done' || true

          echo "=== HTTP with Host header via server LAN IP ==="
          $SSH_CMD "$TARGET" 'IP=$(hostname -I | awk "{print \$1}"); for d in teonoxstudio.com blanchedalmond-flamingo-767844.hostingersite.com; do printf "%s -> " "$d"; curl -sS --max-time 10 -o /dev/null -w "%{http_code}" -H "Host: $d" "http://$IP/" 2>&1 | tr "\n" " "; echo; done' || true

          echo "=== HTTP with Host + SNI-less https on 443 raw ==="
          $SSH_CMD "$TARGET" 'for d in teonoxstudio.com blanchedalmond-flamingo-767844.hostingersite.com; do printf "%s -> " "$d"; curl -sS --max-time 10 -k -o /dev/null -w "%{http_code}" "https://127.0.0.1/" -H "Host: $d" 2>&1 | tr "\n" " "; echo; done' || true

          echo "=== recent per-vhost web logs (which domains are configured) ==="
          $SSH_CMD "$TARGET" 'ls -lat ~/.logs 2>/dev/null | head -14' || true
