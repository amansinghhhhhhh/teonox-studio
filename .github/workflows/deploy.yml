name: Deploy Teonox Studio to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Fail fast with a clear message if the key is malformed/truncated
          if ! head -1 ~/.ssh/id_ed25519 | grep -q 'BEGIN OPENSSH PRIVATE KEY'; then
            echo "::error::SSH_KEY secret does not start with '-----BEGIN OPENSSH PRIVATE KEY-----'"
            exit 1
          fi
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null 2>&1; then
            echo "::error::SSH_KEY secret is not a valid (unencrypted) ed25519 private key"
            exit 1
          fi
          echo "SSH key loaded and validated."

      - name: Deploy dist/ to Hostinger via SSH/rsync
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          PORT: ${{ secrets.PORT || 22 }}
          TARGET_DIR: ${{ secrets.TARGET_DIR }}
        run: |
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts
          rsync -avz -e "ssh -p $PORT -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=no" \
            --delete dist/ "${USERNAME}@${HOST}:${TARGET_DIR}/"
